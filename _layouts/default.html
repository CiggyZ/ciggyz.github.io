<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0d0e">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{{ page.title | default: 'Home' | escape }}</title>
  <link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
  <!-- Initialise the custom cursor before first paint, preserving its position across navigation. -->
  <script>
  (() => {
    if (!window.matchMedia('(hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference)').matches) return;
    const root = document.documentElement;
    root.classList.add('precision-active');
    const key = 'portfolio-pointer-v1';
    let prior = null;
    try { prior = JSON.parse(sessionStorage.getItem(key) || 'null'); } catch (_) {}
    if (!prior) {
      try { if (window.name.startsWith(key + ':')) prior = JSON.parse(window.name.slice(key.length + 1)); } catch (_) {}
    }
    if (prior && Number.isFinite(prior.x) && Number.isFinite(prior.y)) {
      root.style.setProperty('--cursor-x', Math.max(0, Math.min(innerWidth, prior.x)) + 'px');
      root.style.setProperty('--cursor-y', Math.max(0, Math.min(innerHeight, prior.y)) + 'px');
      root.classList.add('cursor-restored');
    }
  })();
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
<body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
  <a href="#main" class="skip-link">Skip to content</a>
  <div class="precision-cursor" id="precision-cursor" aria-hidden="true"></div>
  <div class="precision-dot" id="precision-dot" aria-hidden="true"></div>
  <canvas class="terminal-canvas" id="terminal-canvas" aria-hidden="true"></canvas>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="site-mark" href="{{ '/' | relative_url }}" aria-label="Home"><img src="{{ '/assets/images/mark.webp' | relative_url }}" alt="" width="42" height="42"></a>
      <nav class="desktop-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}"{% if page.section == 'home' %} aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/writeups/' | relative_url }}"{% if page.section == 'writeups' %} aria-current="page"{% endif %}>Writeups</a>
        <a href="{{ '/projects/' | relative_url }}"{% if page.section == 'projects' %} aria-current="page"{% endif %}>Projects</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.section == 'about' %} aria-current="page"{% endif %}>About</a>
      </nav>
      <div class="header-end"><span class="location">Melbourne, AU</span>
        <button class="menu-toggle" id="menu-toggle" type="button" aria-controls="mobile-nav" aria-expanded="false">Menu <span aria-hidden="true">+</span></button>
      </div>
    </div>
  </header>
  <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation" hidden>
    <a href="{{ '/' | relative_url }}"{% if page.section == 'home' %} aria-current="page"{% endif %}>Home</a>
    <a href="{{ '/writeups/' | relative_url }}"{% if page.section == 'writeups' %} aria-current="page"{% endif %}>Writeups</a>
    <a href="{{ '/projects/' | relative_url }}"{% if page.section == 'projects' %} aria-current="page"{% endif %}>Projects</a>
    <a href="{{ '/about/' | relative_url }}"{% if page.section == 'about' %} aria-current="page"{% endif %}>About</a>
  </nav>
  <main id="main" class="shell">{{ content }}</main>
  <footer class="site-footer shell"><span>Melbourne, Australia</span><a href="https://github.com/CiggyZ" target="_blank" rel="noopener noreferrer">GitHub ↗</a></footer>
</body>
</html>
